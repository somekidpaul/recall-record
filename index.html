    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Recall Record: nearly half of US consumer product recalls now name only Amazon</title>
    <meta
      name="description"
      content="Nearly half of every US consumer product recall in 2026 names Amazon as the only store, up from one in nineteen in 2015. Rebuilt weekly from free government data, with the method and the gaps shown in full."
    />
    <link rel="canonical" href="https://recallrecord.com/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100c0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="The Recall Record" />
    <meta property="og:url" content="https://recallrecord.com/" />
    <meta property="og:title" content="Nearly half of US consumer product recalls now name only Amazon" />
    <meta
      property="og:description"
      content="In 2015 it was one in nineteen. This year it is nearly one in two. The obvious objection is that everyone shops online now, and the data does not support it."
    />
    <meta property="og:image" content="https://recallrecord.com/og.png" />
    <meta property="og:image:alt" content="A line chart showing the share of US consumer product recalls that name Amazon as the only store, rising from 0% in 2004 to 46.9% in 2026 while Walmart, Target and Home Depot stay far lower." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nearly half of US consumer product recalls now name only Amazon" />
    <meta
      name="twitter:description"
      content="In 2015 it was one in nineteen. This year it is nearly one in two. Built from free government data."
    />
    <meta name="twitter:image" content="https://recallrecord.com/og.png" />

    <!--
      Structured data. Dataset rather than Article, because the thing of value
      here is the computed figures and their provenance, and that is what a
      search engine or an LLM should be able to read without parsing the page.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "temporalCoverage": "2004/2026",
        "name": "The Recall Record: retailer share of US consumer product recalls",
        "description": "Share of US consumer product recalls whose CPSC retailer description names each major retailer, by year, 2004 to 2026, alongside the share naming Amazon as the sole store and the country of manufacture for each group. Includes three independent definitions of online sale, a description-length control, and per-field source coverage. Built from 9,975 CPSC notices going back to 1973.",
        "url": "https://recallrecord.com/",
        "license": "https://www.usa.gov/government-works",
        "isAccessibleForFree": true,
        "creator": {
          "@type": "Person",
          "name": "Paul Buczkowski",
          "url": "https://somekidpaul.com"
        },
        "isBasedOn": {
          "@type": "Dataset",
          "name": "CPSC Recalls API",
          "url": "https://www.saferproducts.gov/RestWebServices/Recall?format=json"
        },
        "distribution": [
          {
            "@type": "DataDownload",
            "encodingFormat": "text/csv",
            "contentUrl": "https://recallrecord.com/recall-data.csv"
          },
          {
            "@type": "DataDownload",
            "encodingFormat": "application/json",
            "contentUrl": "https://recallrecord.com/recall-data.json"
          }
        ]
      }
    </script>

    <!--
      Resolve theme and motion before first paint.

      Both default to the OS preference and both can be overridden by the
      controls in the header. Doing it here rather than in React avoids a
      flash of the wrong theme, and stamping an explicit data-motion value
      means the CSS never has to read the media query itself.
    -->
    <script>
      (function () {
        var r = document.documentElement
        try {
          var t = localStorage.getItem('rr-theme')
          if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t)

          var m = localStorage.getItem('rr-motion')
          if (m !== 'full' && m !== 'reduced') {
            m = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full'
          }
          r.setAttribute('data-motion', m)
        } catch (e) {
          r.setAttribute('data-motion', 'reduced')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
