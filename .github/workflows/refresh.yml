name: Refresh CPSC data

on:
  schedule:
    # WEEKLY, Fridays at 09:00 UTC (5am ET).
    #
    # The cadence is set by the source, and the source is weekly. Measured over
    # the 2,190 recalls published since the start of 2020: 83.7% are dated a
    # THURSDAY and 14.0% a Wednesday, so 97.7% of everything CPSC publishes
    # lands on one of two days. There is no such thing as Sunday data.
    #
    # This ran daily, which meant six runs a week against a source that had not
    # moved. Those runs cost an API call and produced no commit, so they were
    # not harmful, just untrue to how the data actually behaves: a page that
    # claims to rebuild daily off a feed that updates weekly is describing its
    # own machinery rather than its subject.
    #
    # Friday 09:00 UTC is the first moment that is unambiguously after the whole
    # of Thursday in US time (05:00 ET), so a Thursday batch is always complete
    # before the job reads it. The Wednesday 14% is picked up by the same run.
    #
    # A run that finds nothing new commits nothing, so a quiet week costs one
    # API call and leaves no trace in the history.
    - cron: '0 9 * * 5'
  workflow_dispatch: # so it can be run by hand without waiting for the schedule

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The OG card is rasterised from SVG at build time. Not preinstalled on
      # the runner, and the data step calls it.
      - name: Install SVG rasteriser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - run: npm ci

      # Fetches CPSC, recomputes every figure, and exits non-zero if the corpus
      # shrank, a year's retailer field fell below 95%, or the newest recall is
      # more than 28 days old. A silent failure here would leave the site
      # confidently displaying stale numbers, which is the one thing it must not do.
      - name: Rebuild figures
        run: npm run data

      # THE GATE, and it has to sit here: after the fetch, before the commit.
      #
      # build-data.mjs asserts that the build did not go obviously wrong. These
      # assert that the figures the PAGE prints are true of the feed that was
      # just downloaded: every year's recall count, the Amazon share recomputed
      # from scratch, the pre-2004 coverage behind the "why it starts in 2004"
      # answer, the UPC figure /check quotes as its own limit, and the claim
      # that retailer coverage is 99%+ in every year since 2004.
      #
      # That last one is the reason this step exists at all. It is a sentence on
      # /method asserting something about CPSC's data quality, and CPSC can
      # change underneath it at any time. If it ever stops being true, the run
      # fails and nothing is published, rather than the site quietly continuing
      # to make a claim that has expired.
      #
      # The raw feed is on disk at this point because `npm run data` just wrote
      # it, so the cross-check layer runs here. It skips loudly when the file is
      # absent, which is why it must not be moved above the fetch.
      - name: Verify the published figures against the feed
        run: npm test

      - name: Typecheck and build
        run: npx tsc -b && npx vite build && node scripts/build-routes.mjs

      - name: Commit if the data moved
        run: |
          git config user.name  "recall-record bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # THE TEXT DECIDES, THE IMAGE RIDES ALONG.
          #
          # index.html is staged here because `npm run data` rewrites it: the
          # share-card alt text carries live figures and is generated from the
          # series, so leaving it out would discard that edit and let the alt
          # text drift, which is the exact bug generating it was meant to stop.
          #
          # og.png is deliberately NOT in this list. It is rasterised from SVG,
          # and the runner's librsvg does not produce byte-identical output to
          # any other machine's: the first run here rewrote it from 80,206 to
          # 76,001 bytes with the underlying figures completely unchanged. Had
          # it been staged, every unchanged day would still look like a change,
          # commit, and trigger a deploy for nothing.
          #
          # So the decision is made on the text files only. When they do move,
          # the freshly rendered image is added to the same commit below.
          git add src/data/recalls.json public/recall-data.json public/recall-data.csv \
                  public/sitemap.xml index.html
          if git diff --staged --quiet; then
            echo "No change in the figures. Nothing to publish."
          else
            git add public/og.png public/og.svg
            NEWEST=$(node -p "require('./src/data/recalls.json').newestRecallDate")
            TOTAL=$(node -p "require('./src/data/recalls.json').corpusTotal")
            git commit -m "Data refresh: ${TOTAL} recalls, newest ${NEWEST}"
            git push
          fi
