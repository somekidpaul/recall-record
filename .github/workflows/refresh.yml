name: Refresh CPSC data

on:
  schedule:
    # DAILY, 22:00 UTC (6pm ET).
    #
    # This was 07:00 UTC on Mondays, which was the wrong day. Measured against
    # the corpus: of the 793 recalls published since the start of 2025, 769 of
    # them (97%) are dated a THURSDAY. CPSC ships in weekly batches, median 8
    # recalls at a time, and a Monday job meant every batch sat up to four days
    # before the page caught up.
    #
    # Daily, and not more often, for the same reason. New data appears about
    # one day in seven, so anything tighter than daily is polling a source that
    # has not moved. 22:00 UTC picks up a Thursday morning US batch the same
    # day, and the other 3% that land midweek are never more than a day stale.
    #
    # A run that finds nothing new commits nothing, so quiet days cost one API
    # call and leave no trace in the history.
    - cron: '0 22 * * *'
  workflow_dispatch: # so it can be run by hand without waiting for the schedule

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The OG card is rasterised from SVG at build time. Not preinstalled on
      # the runner, and the data step calls it.
      - name: Install SVG rasteriser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - run: npm ci

      # Fetches CPSC, recomputes every figure, and exits non-zero if the corpus
      # shrank, a year's retailer field fell below 95%, or the newest recall is
      # more than 28 days old. A silent failure here would leave the site
      # confidently displaying stale numbers, which is the one thing it must not do.
      - name: Rebuild figures
        run: npm run data

      - name: Typecheck and build
        run: npx tsc -b && npx vite build

      - name: Commit if the data moved
        run: |
          git config user.name  "recall-record bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html and the OG images are REBUILT by `npm run data`, not just
          # the JSON. The share-card alt text carries live figures and is
          # rewritten from the series, so leaving index.html unstaged would drop
          # that edit on the floor and let the alt text drift again, which is
          # the exact bug it was generated to prevent.
          git add src/data/recalls.json public/recall-data.json public/recall-data.csv \
                  public/sitemap.xml public/og.png public/og.svg index.html
          if git diff --staged --quiet; then
            echo "No change in the figures. Nothing to publish."
          else
            NEWEST=$(node -p "require('./src/data/recalls.json').newestRecallDate")
            TOTAL=$(node -p "require('./src/data/recalls.json').corpusTotal")
            git commit -m "Data refresh: ${TOTAL} recalls, newest ${NEWEST}"
            git push
          fi
